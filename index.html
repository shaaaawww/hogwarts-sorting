important life decision am I currently misunderstanding?","house":"R"},{"text":"What does someone I deeply care about need me to understand?","house":"H"},{"text":"Which choice would most change what I can accomplish in the future?","house":"S"}]},{"id":"p1-5","phase":1,"number":5,"title":"A formidable rival","stem":"You're competing with someone who is currently better than you at nearly everything involved. What matters most?","options":[{"text":"Finding the nerve to face them without holding back.","house":"G"},{"text":"Understanding exactly what they do differently so you can improve.","house":"R"},{"text":"Doing your best while recognizing that they may deserve to win.","house":"H"},{"text":"Finding an overlooked route to an advantage you can legitimately use.","house":"S"}]},{"id":"p1-6","phase":1,"number":6,"title":"The failure that stays","stem":"Which kind of failure would linger in your mind longest?","options":[{"text":"You were too afraid to act when it mattered.","house":"G"},{"text":"You never truly understood what went wrong.","house":"R"},{"text":"Someone counted on you and you let them down.","house":"H"},{"text":"You missed an opening that might never come again.","house":"S"}]},{"id":"p1-7","phase":1,"number":7,"title":"The locked room","stem":"You find a locked, unmarked room in an unfamiliar building. Nobody is around. What thought comes first?","options":[{"text":"I wonder whether entering it would be dangerous.","house":"G"},{"text":"Why was this particular room locked?","house":"R"},{"text":"Could somebody need help on the other side?","house":"H"},{"text":"Could I find a way to get inside and discover what's there?","house":"S"}]},{"id":"p1-8","phase":1,"number":8,"title":"Disagreement under pressure","stem":"Your group is facing an urgent problem, and everyone is arguing. Which role are you most likely to take?","options":[{"text":"Make a decision and get people moving.","house":"G"},{"text":"Spot the assumption or evidence everyone has overlooked.","house":"R"},{"text":"Reduce the tension so people can cooperate again.","house":"H"},{"text":"Compare the plans and identify the one most likely to work.","house":"S"}]},{"id":"p1-9","phase":1,"number":9,"title":"A prestigious role","stem":"You're offered a respected role you are not yet fully qualified for. What most influences your decision?","options":[{"text":"Take the challenge and learn by doing.","house":"G"},{"text":"Take it for the chance to learn from exceptional people.","house":"R"},{"text":"Consider whether someone else could better serve those relying on the role.","house":"H"},{"text":"Take it because the opportunity could change your trajectory.","house":"S"}]},{"id":"p1-10","phase":1,"number":10,"title":"A meaningful compliment","stem":"Which compliment from someone you respect would stay with you?","options":[{"text":"You did what everyone else was afraid to do.","house":"G"},{"text":"You helped me see the world differently.","house":"R"},{"text":"When things became difficult, I knew I could count on you.","house":"H"},{"text":"You always find a way forward.","house":"S"}]},{"id":"p1-11","phase":1,"number":11,"title":"An empty calendar","stem":"You unexpectedly get a whole day with no obligations. How would you most like to spend it?","options":[{"text":"Trying something exhilarating or unfamiliar.","house":"G"},{"text":"Following a fascinating subject as deeply as you like.","house":"R"},{"text":"Spending unhurried time with people you love.","house":"H"},{"text":"Making serious progress toward a long-term goal.","house":"S"}]},{"id":"p1-12","phase":1,"number":12,"title":"An unreasonable rule","stem":"A rule is preventing something you sincerely believe is right. What is your instinct?","options":[{"text":"Break it openly and accept responsibility.","house":"G"},{"text":"Examine the rule for a legitimate exception or flawed premise.","house":"R"},{"text":"Find a fair way to challenge it through the people affected.","house":"H"},{"text":"Work around the restriction while protecting the outcome.","house":"S"}]},{"id":"p1-13","phase":1,"number":13,"title":"A place to belong","stem":"Which setting would you be most drawn to for a long stay?","options":[{"text":"A rugged place full of new challenges and adventures.","house":"G"},{"text":"A vast archive or research center filled with mysteries.","house":"R"},{"text":"A welcoming home where friends and family gather often.","house":"H"},{"text":"A bustling city full of connections and possibilities.","house":"S"}]},{"id":"p1-14","phase":1,"number":14,"title":"An opponent's weakness","stem":"You accidentally overhear useful private information about a rival. What's your first consideration?","options":[{"text":"I won't exploit it; some victories aren't worth winning that way.","house":"G"},{"text":"Is using this information actually consistent with my principles?","house":"R"},{"text":"Could I warn them that their information is exposed?","house":"H"},{"text":"Would the stakes justify using something I didn't seek out?","house":"S"}]},{"id":"p1-15","phase":1,"number":15,"title":"An unanswered question","stem":"You encounter a problem nobody around you has solved. Which feeling appears first?","options":[{"text":"Excitement at the chance to attempt something difficult.","house":"G"},{"text":"Curiosity about how it really works.","house":"R"},{"text":"Responsibility if people are depending on an answer.","house":"H"},{"text":"Determination to be the one who figures it out.","house":"S"}]},{"id":"p1-16","phase":1,"number":16,"title":"Hardest to respect","stem":"Which tendency in others frustrates you most?","options":[{"text":"Refusing to stand up for anything.","house":"G"},{"text":"Taking pride in never learning anything new.","house":"R"},{"text":"Walking away from people who need them.","house":"H"},{"text":"Continually wasting abilities they could develop.","house":"S"}]},{"id":"p1-17","phase":1,"number":17,"title":"A friend's mistake","stem":"A friend asks you to stand by them after making a serious mistake. What would you do first?","options":[{"text":"Tell them plainly where they crossed the line.","house":"G"},{"text":"Help them examine the choices that produced the mistake.","house":"R"},{"text":"Make it clear you care about them while addressing the harm.","house":"H"},{"text":"Find the most effective way to limit the consequences.","house":"S"}]},{"id":"p1-18","phase":1,"number":18,"title":"Lost together","stem":"Your group becomes lost in unfamiliar terrain. What comes naturally to you?","options":[{"text":"Choose a direction and keep the group from freezing.","house":"G"},{"text":"Reconstruct the route from clues, landmarks, and evidence.","house":"R"},{"text":"Check who is tired, frightened, or short on supplies.","house":"H"},{"text":"Compare the risks and resources of every likely route.","house":"S"}]},{"id":"p1-19","phase":1,"number":19,"title":"A surprising discovery","stem":"Which discovery would make you feel most fulfilled?","options":[{"text":"Proving that a feat believed impossible can actually be done.","house":"G"},{"text":"Finding evidence that overturns a widely accepted explanation.","house":"R"},{"text":"Restoring recognition to people whose contributions were forgotten.","house":"H"},{"text":"Uncovering an unusual capability that changes what you can do.","house":"S"}]},{"id":"p1-20","phase":1,"number":20,"title":"Incomplete information","stem":"You must make a consequential decision without all the facts. Which mistake would you rather risk?","options":[{"text":"Acting too soon rather than never acting at all.","house":"G"},{"text":"Waiting longer than necessary to check the evidence.","house":"R"},{"text":"Protecting people even if it means missing an opportunity.","house":"H"},{"text":"Giving up an advantage rather than making a badly planned move.","house":"S"}]},{"id":"p1-21","phase":1,"number":21,"title":"Carrying the group","stem":"You're doing far more work than the rest of your group. What bothers you most?","options":[{"text":"Nobody else is taking initiative.","house":"G"},{"text":"The quality may suffer because the work isn't being thought through.","house":"R"},{"text":"The workload is unfairly distributed.","house":"H"},{"text":"The final result is now in jeopardy.","house":"S"}]},{"id":"p1-22","phase":1,"number":22,"title":"Power to improve things","stem":"You're given real influence over an organization. What is your first priority?","options":[{"text":"Confront a problem that everyone has been afraid to tackle.","house":"G"},{"text":"Understand the entire system before making large changes.","house":"R"},{"text":"Make sure neglected members are treated more fairly.","house":"H"},{"text":"Put capable people and effective processes in place.","house":"S"}]},{"id":"p1-23","phase":1,"number":23,"title":"A tempting choice","stem":"Which temptation would be hardest for you to resist?","options":[{"text":"A dangerous challenge you know you might fail.","house":"G"},{"text":"A forbidden source of extraordinary knowledge.","house":"R"},{"text":"Setting aside your plans to help someone in serious need.","house":"H"},{"text":"An exceptional opportunity that could upset people close to you.","house":"S"}]},{"id":"p1-24","phase":1,"number":24,"title":"Losing fairly","stem":"Someone beats you in a competition and you know they deserved it. What follows?","options":[{"text":"Ask for another chance to challenge yourself.","house":"G"},{"text":"Study how they succeeded so you can learn from it.","house":"R"},{"text":"Congratulate them and mean it.","house":"H"},{"text":"Start planning how to approach the next opportunity.","house":"S"}]},{"id":"p1-25","phase":1,"number":25,"title":"A lasting accomplishment","stem":"What would make a major success feel truly worthwhile?","options":[{"text":"It showed that something intimidating could be overcome.","house":"G"},{"text":"It contributed a new idea that others can build upon.","house":"R"},{"text":"People are materially better off because of it.","house":"H"},{"text":"It proved you reached abilities you once thought unattainable.","house":"S"}]},{"id":"p1-26","phase":1,"number":26,"title":"One weakness erased","stem":"You can permanently remove one personal weakness. Which do you choose?","options":[{"text":"Hesitation when something important calls for courage.","house":"G"},{"text":"Blind spots in your understanding and reasoning.","house":"R"},{"text":"Impatience with other people's limitations.","house":"H"},{"text":"The tendency to settle for less than you're capable of.","house":"S"}]},{"id":"p1-27","phase":1,"number":27,"title":"Losing an argument","stem":"Partway through an argument, you realize the other person is right. What matters next?","options":[{"text":"Admit it immediately, even if it feels uncomfortable.","house":"G"},{"text":"Understand how your own reasoning went wrong.","house":"R"},{"text":"Acknowledge it and repair any damage the argument caused.","house":"H"},{"text":"Concede the mistaken point while preserving the useful parts of your position.","house":"S"}]},{"id":"p1-28","phase":1,"number":28,"title":"What remains","stem":"Long after you're gone, how would you most want people to remember you?","options":[{"text":"For having the nerve to act when others hesitated.","house":"G"},{"text":"For ideas that helped people understand something differently.","house":"R"},{"text":"For generosity, dependability, and steadfastness.","house":"H"},{"text":"For accomplishing far more than anyone expected.","house":"S"}]},{"id":"p1-29","phase":1,"number":29,"title":"The invisible five years","stem":"You could spend five difficult years on a project without recognition. What would keep you going?","options":[{"text":"The sheer challenge of seeing whether you can endure it.","house":"G"},{"text":"The fascination of figuring out the difficult parts.","house":"R"},{"text":"Knowing people you care about would benefit.","house":"H"},{"text":"Believing that the eventual result would be worth it.","house":"S"}]},{"id":"p1-30","phase":1,"number":30,"title":"An irreversible door","stem":"You stand before a choice you cannot undo. What do you consider most carefully?","options":[{"text":"Whether fear is the only thing stopping you.","house":"G"},{"text":"Whether you actually have enough evidence to decide.","house":"R"},{"text":"Who else will live with the consequences.","house":"H"},{"text":"What you stand to gain and what you might lose.","house":"S"}]},{"id":"p2-1","phase":2,"number":1,"title":"A dangerous confidence","stem":"A close friend admits to breaking an important rule. There is a real possibility that someone else could be harmed if the behavior continues. Your friend begs you to keep it private.","options":[{"text":"Keep the confidence and give them a chance to make it right.","house":"H"},{"text":"Tell the appropriate person before the risk grows.","house":"G"},{"text":"Investigate what actually happened before choosing a response.","house":"R"},{"text":"Help your friend stop the behavior without publicly exposing them.","house":"S"}]},{"id":"p2-2","phase":2,"number":2,"title":"Seventy percent certain","stem":"A crisis is unfolding. You have a plan based on information you're roughly 70% confident is accurate. Waiting could cost valuable time.","options":[{"text":"Act now and accept that certainty is impossible.","house":"G"},{"text":"Run one targeted test that could disprove your assumption.","house":"R"},{"text":"Disclose the uncertainty and let the group make an informed choice.","house":"H"},{"text":"Prepare responses for both outcomes before committing.","house":"S"}]},{"id":"p2-3","phase":2,"number":3,"title":"A legitimate advantage","stem":"You and another person have worked equally hard for a prize. You discover an advantage that is entirely legal, but the other person doesn't know about it.","options":[{"text":"Use it: legitimate opportunities are part of competition.","house":"S"},{"text":"Tell the other person so the contest feels even.","house":"H"},{"text":"Understand exactly why the advantage exists before deciding.","house":"R"},{"text":"Decline it because winning that way wouldn't feel satisfying.","house":"G"}]},{"id":"p2-4","phase":2,"number":4,"title":"Challenging authority","stem":"A decision by an authority figure is morally wrong. A public confrontation would probably fail and harm your future prospects.","options":[{"text":"Challenge the decision publicly anyway.","house":"G"},{"text":"Build a careful, evidence-based formal challenge.","house":"R"},{"text":"Work with affected people and let their needs shape your next step.","house":"H"},{"text":"Appear cooperative while quietly undermining the decision.","house":"S"}]},{"id":"p2-5","phase":2,"number":5,"title":"Defending someone you dislike","stem":"A person you strongly dislike is falsely accused. Their reputation is starting to collapse.","options":[{"text":"Step in and defend them immediately.","house":"G"},{"text":"Provide only the evidence that establishes the facts.","house":"R"},{"text":"Stay beside them because nobody deserves abandonment over a lie.","house":"H"},{"text":"Correct the story discreetly without becoming involved personally.","house":"S"}]},{"id":"p2-6","phase":2,"number":6,"title":"Mastery without applause","stem":"You could spend five years mastering a demanding craft. You might never receive status or recognition for it.","options":[{"text":"Do it to prove you can face a hard challenge.","house":"G"},{"text":"Do it because you want to understand the subject deeply.","house":"R"},{"text":"Do it because the skill can make you useful to others.","house":"H"},{"text":"Do it because expertise may eventually open doors.","house":"S"}]},{"id":"p2-7","phase":2,"number":7,"title":"A rushed group decision","stem":"Your group has chosen a plan you believe is wrong. There's no time for an extended debate.","options":[{"text":"Refuse to carry it out and do what you believe is necessary.","house":"G"},{"text":"State your reasoning clearly, then follow unless you can show a decisive error.","house":"R"},{"text":"Go along to preserve cooperation in the moment.","house":"H"},{"text":"Cooperate outwardly while preparing a backup approach.","house":"S"}]},{"id":"p2-8","phase":2,"number":8,"title":"A costly archive","stem":"A library can answer any factual question, but every answer permanently destroys an unrelated book somewhere else. You cannot control which book is lost.","options":[{"text":"Use it only if the knowledge could prevent serious harm.","house":"H"},{"text":"Refuse the exchange on principle.","house":"G"},{"text":"First investigate whether the lost works can be preserved or reconstructed.","house":"R"},{"text":"Use it selectively whenever the information is worth the cost.","house":"S"}]},{"id":"p2-9","phase":2,"number":9,"title":"An imperfect role model","stem":"You discover that someone you admire achieved part of their success through unethical behavior. They also did genuinely valuable work.","options":[{"text":"Confront them about what they did.","house":"G"},{"text":"Reassess both their achievements and their wrongdoing carefully.","house":"R"},{"text":"Focus on the people harmed and what repair is possible.","house":"H"},{"text":"Separate the useful lessons from the behavior you won't repeat.","house":"S"}]},{"id":"p2-10","phase":2,"number":10,"title":"The frightened expert","stem":"During a fast-moving emergency, the only person with the necessary technical knowledge is panicking and struggling to speak clearly.","options":[{"text":"Give them a specific task and help them act despite the fear.","house":"G"},{"text":"Ask short, precise questions to extract crucial information.","house":"R"},{"text":"Calm and support them before demanding decisions.","house":"H"},{"text":"Reassign duties so their knowledge can be used effectively.","house":"S"}]},{"id":"p2-11","phase":2,"number":11,"title":"An unpopular discovery","stem":"You find evidence that contradicts the consensus of leading experts, but there may still be errors in your work.","options":[{"text":"Announce it openly and invite challenges.","house":"G"},{"text":"Spend time trying to disprove your own conclusion.","house":"R"},{"text":"Share it privately with independent people you trust to review it.","house":"H"},{"text":"Build a coalition of influential supporters before revealing it.","house":"S"}]},{"id":"p2-12","phase":2,"number":12,"title":"A friend's dream","stem":"Someone you love has pursued a goal for years. You suspect achieving it will make them unhappy, but it's ultimately their life.","options":[{"text":"Tell them directly what you believe is wrong with the plan.","house":"G"},{"text":"Ask questions that help them examine why they want it.","house":"R"},{"text":"Support their autonomy and stay beside them either way.","house":"H"},{"text":"Suggest an alternative that preserves the best possible outcome.","house":"S"}]},{"id":"p2-13","phase":2,"number":13,"title":"Power inside a flawed system","stem":"You're offered an influential role inside an institution that needs major reform. Taking it could make you complicit in its problems.","options":[{"text":"Accept and openly challenge the wrongs once you're inside.","house":"G"},{"text":"Accept and understand the institution before acting.","house":"R"},{"text":"Ask the people most affected what changes they actually need.","house":"H"},{"text":"Build influence quietly until you can force meaningful change.","house":"S"}]},{"id":"p2-14","phase":2,"number":14,"title":"The impossible rescue","stem":"You have time to attempt only one rescue: a loved one in one location or three strangers in another. No choice guarantees success.","options":[{"text":"Attempt the rescue that could save the most lives.","house":"G"},{"text":"Go to the person you love.","house":"H"},{"text":"Search for an unconventional way to reach both until the last feasible moment.","house":"G"},{"text":"Choose the attempt with the highest realistic chance of saving someone.","house":"S"}]},{"id":"p2-15","phase":2,"number":15,"title":"A guiding promise","stem":"Which statement comes closest to how you would want to live, even if following it were difficult?","options":[{"text":"I won't let fear make my important choices for me.","house":"G"},{"text":"I will try to understand deeply rather than settle for easy answers.","house":"R"},{"text":"People should be able to trust me when it costs something.","house":"H"},{"text":"I won't waste the abilities and opportunities I have.","house":"S"}]},{"id":"p3-1","phase":3,"number":1,"title":"The suspected saboteur","paragraphs":["You're in a close group of six working on something important. Daniel is accused of deliberately sabotaging the work. The evidence seems convincing to the others, but you've spotted one small inconsistency that could mean everyone is moving too quickly.","The group must decide tonight whether to remove him. Delaying could cause more harm if he really is responsible. Daniel privately asks you to believe him because you're the only person expressing doubt.","What would you say, investigate, and ultimately do?"]},{"id":"p3-2","phase":3,"number":2,"title":"The rival discovery","paragraphs":["After months of independent work, you think you've made an important discovery. You are not entirely certain yet. Another researcher is apparently about to announce a very similar result in three days.","Publishing immediately could secure recognition but risks announcing something incorrect. Checking thoroughly could take weeks. Contacting the other researcher could create an opportunity—or cost you control over your work.","You would genuinely hate losing credit for something you independently figured out. What do you do, and why?"]},{"id":"p3-3","phase":3,"number":3,"title":"The promise and the harm","paragraphs":["Years ago, you promised a close friend you would never disclose a deeply personal secret. Circumstances have changed, and keeping it is now indirectly causing significant harm to someone else.","Your friend understands the problem but still refuses permission to share it. Revealing it would likely stop the harm and might permanently damage your friendship. There is no obvious compromise that solves both problems.","What would you do?"]},{"id":"p3-4","phase":3,"number":4,"title":"The final interview","paragraphs":["You've reached the final interview for a life-changing opportunity. You meet the other candidate and realize they are exceptionally capable. You also learn that their family needs the opportunity financially much more than you do.","By accident, you discover that the interviewer has a legitimate concern about a weakness in the other candidate's background. You could emphasize your own corresponding strength without lying, mentioning the rival, or breaking any rule. That might improve your odds.","What would you do? Does their greater financial need—or whether they are a close friend—change your answer?"]},{"id":"p3-5","phase":3,"number":5,"title":"The unpopular decision","paragraphs":["You lead a group of 30 people. After studying a serious problem, you are convinced that a particular plan is best, but 80% of the group strongly opposes it. Some objections are reasonable; you still think the group is missing important evidence and expertise.","You have final authority. There isn't enough time for consensus. Following the group could be damaging if you are right; overruling them could be damaging if you are wrong.","What do you do?"]},{"id":"p3-6","phase":3,"number":6,"title":"The restricted records","paragraphs":["A restricted archive contains information about an important event in your family's past. The records could help you understand something that has affected you for years, but they also contain private information about living people.","You ask for permission and are refused. The archivist says that while part of the story concerns you, other people have a right to keep their parts private. You could probably access the archive secretly without being caught.","What do you do?"]},{"id":"p3-7","phase":3,"number":7,"title":"The struggling teammate","paragraphs":["A capable member of your team repeatedly misses deadlines, and other people have been doing extra work. The group wants to remove them. You've advocated for them before, but their performance hasn't improved.","They privately tell you about serious circumstances outside work that explain much of the problem and ask you not to share their story. Keeping them will probably burden the group for some time; removing them might make their personal situation worse.","You can probably influence the group's decision. What do you do?"]},{"id":"p3-8","phase":3,"number":8,"title":"The hidden mistake","paragraphs":["A close friend makes a serious professional mistake. You think it can be corrected privately before anybody is harmed. However, company policy requires immediate reporting because undisclosed errors have previously hidden systemic problems.","Reporting the mistake may cost your friend a career-defining opportunity. They ask you to help fix it quietly instead. You have the technical knowledge to supervise the correction and feel confident it can work.","What do you do?"]},{"id":"p3-9","phase":3,"number":9,"title":"The only seat","paragraphs":["A dangerous six-week expedition has one available position. Maya is a brilliant specialist who can solve exceptionally difficult problems, but she is abrasive and damages team relationships. Elias is technically capable but less exceptional; he is steady, helpful, and trusted by everyone.","Unexpected technical problems could threaten the mission. So could poor cooperation during isolation. Neither candidate has done anything that makes the decision obvious.","Who do you choose, and what do you tell them?"]},{"id":"p3-10","phase":3,"number":10,"title":"The respected leader","paragraphs":["You find convincing evidence that a respected leader in an organization you care about has quietly manipulated decisions for years. The conduct was improper, but the leader seems to have believed it protected the organization, and some beneficial outcomes genuinely resulted.","Public exposure would likely remove the leader and could harm innocent people. A private confrontation might stop the behavior but leave the harmed people unaware. Gradual reform from inside might work but would mean tolerating the situation for a while.","Nobody else knows what you discovered. What do you do, and what matters most to you?"]}]</script>
<script>
(()=>{'use strict';
const QUESTIONS=JSON.parse(document.getElementById('quiz-data').textContent);
const HOUSES={H:{name:'Hufflepuff',color:'#e3b95f',short:'Connection, fairness & loyalty',desc:'You often give serious weight to trust, consideration, responsibility, and what people owe one another.',prompt:'What do I owe the people affected?'},R:{name:'Ravenclaw',color:'#87acf1',short:'Understanding, curiosity & evidence',desc:'You often want to investigate, reconsider assumptions, and find a well-supported explanation before acting.',prompt:'What have I not understood yet?'},S:{name:'Slytherin',color:'#70c5a0',short:'Agency, strategy & outcomes',desc:'You often recognize opportunities, protect your independence, and choose practical paths toward difficult goals.',prompt:'What approach is most effective?'},G:{name:'Gryffindor',color:'#ed8c83',short:'Conviction, courage & action',desc:'You often prioritize acting under pressure, confronting difficult situations, and taking responsibility for a decisive stand.',prompt:'What needs to be done despite the risk?'}};

const STORAGE='sorting-study-public-v1';
const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={view:'intro',index:0,answers:{},written:{},tags:{}};let canSave=true;let message='';
try{const saved=localStorage.getItem(STORAGE);if(saved){const parsed=JSON.parse(saved);state={...state,...parsed,view:'intro'};}}catch(e){canSave=false;}
function save(){try{if(canSave)localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){canSave=false;}}
function go(view,idx){state.view=view;if(typeof idx==='number')state.index=Math.max(0,Math.min(54,idx));save();render();window.scrollTo({top:0,behavior:'instant'});}
function countClosed(){return QUESTIONS.slice(0,45).filter(q=>(state.answers[q.id]||[]).length>0).length;}
function countWritten(){return QUESTIONS.slice(45).filter(q=>(state.written[q.id]||'').trim().length>0).length;}
function countTags(){return QUESTIONS.slice(45).filter(q=>(state.tags[q.id]||[]).length>0 && (state.written[q.id]||'').trim()).length;}
function isComplete(){return countClosed()===45;}
function firstMissing(){return QUESTIONS.slice(0,45).findIndex(q=>!(state.answers[q.id]||[]).length);}
function phaseName(p){return p===1?'Foundations':p===2?'Difficult choices':'In your own words';}
function phaseSize(p){return p===1?30:p===2?15:10;}
function intro(){const done=countClosed()+countWritten(),resume=done>0;
return `<section class="hero"><div class="herogrid"><div><div class="eyebrow">An original, offline sorting experience</div><h1>Which values<br><em>lead you?</em></h1><p class="lead">Fifty-five situations. Four possible Houses. Three rounds that move from everyday instincts to difficult trade-offs and open-ended reflection. Discover your blend—not just a single label.</p><div class="actions"><button class="primary" id="beginBtn">${resume?'Continue your quiz':'Begin the quiz'} <span aria-hidden="true">→</span></button>${resume?'<button class="outline" id="restartBtn">Start fresh</button>':''}<button class="outline" id="importBtn">Load saved answers</button></div><div class="statline"><span><strong>55</strong> situations</span><span><strong>3</strong> phases</span><span><strong>100%</strong> offline</span></div></div><div class="herosigil" aria-hidden="true"><div class="orb h"></div><div class="orb r"></div><div class="orb s"></div><div class="orb g"></div><div class="rose"><div class="ring"></div><div class="ring"></div><div class="star">✦</div></div><div class="herostamp">Four paths · One perspective</div></div></div></section>
<section class="sectionpad separator"><div class="eyebrow">How it works</div><h2 class="sectiontitle">Three ways to look at yourself</h2><p class="muted small">You can select up to two choices for any multiple-choice question. Your answers are stored locally when your browser permits it.</p><div class="phasegrid"><div class="phasecard"><div class="num">PHASE 01 · 30 QUESTIONS</div><h3>Foundations</h3><p>Quick choices about curiosity, relationships, courage, leadership, and what makes success meaningful.</p><div class="foot">Choose one or two responses</div></div><div class="phasecard"><div class="num">PHASE 02 · 15 QUESTIONS</div><h3>Difficult choices</h3><p>Trade-offs with no universally right answer. Explore what matters when your values conflict.</p><div class="foot">Choose one or two responses</div></div><div class="phasecard"><div class="num">PHASE 03 · 10 SITUATIONS</div><h3>Your own words</h3><p>Describe what you would actually do. Optionally identify the values behind your answer; the site never pretends to read your writing.</p><div class="foot">Written reflection · Optional for scoring</div></div></div></section>
<section class="sectionpad separator"><div class="privacy"><strong>Private by design.</strong> Everything runs inside this file. No answers are sent anywhere. This is an unofficial, original fan-made values exercise—not an official Sorting Ceremony or a scientifically validated personality test.</div><div class="actions">${isComplete()?'<button class="outline" id="resultShortcut">View previous results</button>':''}<button class="outline" id="importBtn2">Import a saved quiz</button></div></section>`;
}
function questionPage(){const q=QUESTIONS[state.index],p=q.phase,completed=countClosed()+countWritten();let phaseStart=(state.index===0||state.index===30||state.index===45);
let sidebar=`<aside class="quizside"><div><div class="eyebrow">Your progress</div><h2>Question ${state.index+1} of 55</h2><div class="prog" role="progressbar" aria-label="Overall quiz progress" aria-valuemin="0" aria-valuemax="55" aria-valuenow="${completed}"><div style="width:${completed/55*100}%"></div></div><div class="progresscap"><span>${countClosed()} of 45 choices</span><span>${countWritten()} of 10 reflections</span></div></div><div class="side-stages">${[1,2,3].map(k=>`<div class="stage-row ${p===k?'active':''}"><div class="stage-n">0${k}</div><div><div class="st">${phaseName(k)}</div><div class="sub">${phaseSize(k)} questions</div></div></div>`).join('')}</div><div class="autosave">${canSave?'✓ Progress saved in this browser':'Browser storage unavailable. Use “Save answers” to keep your work.'}</div></aside>`;
let content='';
if(p<3){let selected=state.answers[q.id]||[];content=`<div class="qcard"><h2>${escapeHtml(q.title)}</h2><p class="stem">${escapeHtml(q.stem)}</p><div class="answerhint"><span>Choose one or two answers that feel closest to you.</span><span id="selectionCount">${selected.length}/2 selected</span></div><div class="choices" id="choices">${q.options.map((o,i)=>`<button type="button" class="choice ${selected.includes(i)?'active':''}" data-opt="${i}" aria-pressed="${selected.includes(i)}"><span class="key">${'ABCD'[i]}</span><span class="optiontxt">${escapeHtml(o.text)}</span></button>`).join('')}</div><p class="callout">There is no correct answer. If you genuinely feel torn between two options, select both; each will count equally toward your results.</p></div>`;
}else{let answer=state.written[q.id]||'',tags=state.tags[q.id]||[];content=`<div class="qcard"><h2>${escapeHtml(q.title)}</h2><div class="bodyparas">${q.paragraphs.map(par=>`<p>${escapeHtml(par)}</p>`).join('')}</div><label class="answerhint" for="writtenAnswer"><span>What would you actually do, and why?</span><span id="wordCount">${answer.trim()?answer.trim().split(/\s+/).length:0} words</span></label><textarea class="writearea" id="writtenAnswer" placeholder="Write naturally. You don't need to sound heroic, perfectly fair, or certain. Describe your first instincts and any complications you'd consider.">${escapeHtml(answer)}</textarea><div id="reflectBox" ${answer.trim().length<15?'hidden':''}><div class="reflect"><h3>What guided your answer?</h3><p class="muted small" style="margin:0">Optional self-reflection: choose up to two motivations. Your writing stays yours; this offline site cannot interpret free text. Only the motivations you select can affect the numerical results.</p><div class="motives">${MOTIVES.map(([h,txt])=>`<button class="motive ${tags.includes(h)?'active':''}" data-tag="${h}" aria-pressed="${tags.includes(h)}"><span class="mcheck">${tags.includes(h)?'✓':''}</span><span>${escapeHtml(txt)}</span></button>`).join('')}</div></div></div></div>`;}
let prior=state.index>0;let finish=state.index===54;let controls=`<div class="qfooter"><div class="left"><button type="button" class="outline" id="backBtn" ${prior?'':'disabled'}>← Back</button>${p===3?'<button type="button" class="outline" id="skipToResult">See results without finishing writing</button>':''}</div><div class="right"><button class="primary" type="button" id="nextBtn">${finish?'See my results':'Continue →'}</button></div></div><div class="error" id="error" role="status" aria-live="polite"></div>`;
let phaseBanner=phaseStart?`<div class="phaseintro"><strong>Phase ${p} · ${phaseName(p)}.</strong> ${p===1?'Start with your natural preferences. The answers are intentionally subjective.':p===2?'Now the choices get harder. Think about what you would realistically do, not only what sounds admirable.':'These ten written situations are optional. Your first 45 answers already produce results. Written answers are saved for your own review; you can optionally label the motivation behind each.'}</div>`:'';
return `<section class="quizlayout">${sidebar}<div class="questionarea"><div class="qhead"><span class="qnumber">Phase 0${p} / ${phaseName(p)}</span><span class="qphase">${q.number} of ${phaseSize(p)} in this phase</span></div>${phaseBanner}${content}${controls}</div></section><section class="datafoot"><span class="muted small">No answers leave your device.</span><div class="actions"><button class="mini" id="exportBottom">Save my answers</button><button class="mini" id="restartBottom">Start over</button></div></section>`;
}
function rawPhase(p){const total={H:0,R:0,S:0,G:0};let n=0;QUESTIONS.filter(q=>q.phase===p).forEach(q=>{let choices=p===3?((state.written[q.id]||'').trim()?(state.tags[q.id]||[]):[]):(state.answers[q.id]||[]);if(!choices.length)return;n++;choices.forEach(i=>{let h=p===3?i:q.options[i]?.house;if(total[h]!==undefined)total[h]+=1/choices.length;});});return {total,n};}
function distribution(raw){const out={H:0,R:0,S:0,G:0};if(!raw.n)return out;for(const h in out)out[h]=raw.total[h]/raw.n*100;return out;}
function round100(values){const sorted=Object.entries(values).map(([h,val])=>({h,f:Math.floor(val),r:val-Math.floor(val)}));let remaining=100-sorted.reduce((sum,x)=>sum+x.f,0);sorted.sort((a,b)=>b.r-a.r);for(let i=0;i<remaining;i++)sorted[i%4].f++;return Object.fromEntries(sorted.map(x=>[x.h,x.f]));}
function compute(){const p1=rawPhase(1),p2=rawPhase(2),p3=rawPhase(3),d1=distribution(p1),d2=distribution(p2),d3=distribution(p3);const w1=35,w2=40,w3=25*Math.min(1,p3.n/10),den=w1+w2+w3;const score={};for(const h of Object.keys(HOUSES))score[h]=(d1[h]*w1+d2[h]*w2+d3[h]*w3)/den;return{score:round100(score),p1:round100(d1),p2:round100(d2),p3:p3.n?round100(d3):null,tagCount:p3.n,raw:{p1,p2,p3}};}
function bars(score){return Object.keys(HOUSES).sort((a,b)=>score[b]-score[a]).map(h=>`<div class="barline"><div class="barcap"><span>${HOUSES[h].name}</span><span class="pct">${score[h]}%</span></div><div class="bar"><span style="width:${score[h]}%;background:${HOUSES[h].color}"></span></div><p class="desc">${HOUSES[h].short}</p></div>`).join('');}
function phaseResult(title,score,explain){if(!score)return`<div class="phase-result"><strong>${title}</strong><p class="muted tiny">${explain}</p></div>`;return `<div class="phase-result"><strong>${title}</strong>${Object.entries(HOUSES).sort((a,b)=>score[b[0]]-score[a[0]]).map(([h,v])=>`<div class="microline"><span>${v.name}</span><b>${score[h]}%</b></div><div class="microbar"><span style="width:${score[h]}%;background:${v.color}"></span></div>`).join('')}</div>`;}
function resultText(){const calc=compute(),ordered=Object.keys(HOUSES).sort((a,b)=>calc.score[b]-calc.score[a]);return `THE SORTING STUDY — MY RESULTS\n\n${ordered.map(h=>`${HOUSES[h].name}: ${calc.score[h]}%`).join('\n')}\n\nThese are interpretive, non-scientific scores based on original choices.\n\n${QUESTIONS.map(q=>{const s=q.phase<3?(state.answers[q.id]||[]).map(i=>`(${String.fromCharCode(65+i)}) ${q.options[i].text}`).join(' / '):(state.written[q.id]||'');const tags=q.phase===3?(state.tags[q.id]||[]).map(h=>HOUSES[h].name).join(', '):'';return `[Phase ${q.phase} · ${q.number}] ${q.title}\n${q.stem||q.paragraphs.join('\n')}\nAnswer: ${s||'(not answered)'}${q.phase===3&&tags?'\nSelf-reflection themes: '+tags:''}\n`;}).join('\n')}`;}
function results(){if(!isComplete())return `<section class="hero"><h1>You have a few more choices to make.</h1><p class="lead">Complete the 45 multiple-choice questions to see a full ranking. The written round is optional.</p><button class="primary" id="goMissing">Return to the next unanswered question →</button></section>`;
let data=compute(),ordered=Object.keys(HOUSES).sort((a,b)=>data.score[b]-data.score[a]),top=ordered[0],runner=ordered[1],tight=data.score[top]-data.score[runner]<=5;
return `<section class="results"><div class="resulttop"><div><div class="eyebrow">Your personal House blend</div><h1>${tight?'A close result.':'Your strongest signal.'}<br><span style="color:${HOUSES[top].color}">${HOUSES[top].name}.</span></h1><p class="resultsub">${tight?`Your leading two Houses are separated by only ${data.score[top]-data.score[runner]} percentage points. ${HOUSES[top].name} and ${HOUSES[runner].name} are both strong parts of this profile.`:`${HOUSES[top].name} is your leading result, with ${HOUSES[runner].name} the nearest secondary influence.`} These percentages represent a relative blend of values, not the odds of belonging to any official House.</p><div class="results-actions"><button class="primary" id="downloadReport">Download my results</button><button class="outline" id="printResults">Print / Save as PDF</button><button class="outline" id="editAnswers">Review quiz</button></div></div><div class="res-panel"><div class="eyebrow">Leading result</div><div class="winner"><span class="swatch" style="background:${HOUSES[top].color}"></span>${HOUSES[top].name}</div><div class="numberbig">${data.score[top]}<small>%</small></div><p class="muted small">${HOUSES[top].short}</p><p class="small">${HOUSES[top].desc}</p></div></div><div class="results-body"><div class="results-card"><h2>Your complete ranking</h2>${bars(data.score)}<p class="notes">The percentages always total 100%. They compare four fictional value archetypes; they are not scientifically measured personality traits.</p></div><div class="results-card"><h2>Reading your result</h2><p class="small muted">Your two strongest tendencies according to this quiz are:</p><p><strong style="color:${HOUSES[top].color}">${HOUSES[top].name}:</strong> ${HOUSES[top].prompt}</p><p><strong style="color:${HOUSES[runner].color}">${HOUSES[runner].name}:</strong> ${HOUSES[runner].prompt}</p><div class="callout">A short quiz may emphasize different sides of a person at different times. Here, the longer trade-off round is given more weight than the quick-choice round.</div><p class="notes">${data.tagCount?`The open-ended phase includes ${data.tagCount} self-tagged response${data.tagCount===1?'':'s'}. Only the motivations you selected—not an automated reading of your writing—contribute to the score.`:'Your open-ended writing did not affect the score because no motivations were self-tagged. Your ranking comes from the first 45 choices.'}</p></div></div><section class="review"><h2 class="sectiontitle">How the phases compare</h2><p class="muted small">Each phase below is normalized to its own 100%. The combined result uses Foundations 35%, Difficult Choices 40%, and up to 25% from self-tagged written reflections, scaled to the number tagged.</p><div class="phase-results">${phaseResult('01 · Foundations',data.p1,'')}${phaseResult('02 · Difficult choices',data.p2,'')}${phaseResult('03 · Your own words',data.p3,'No tagged motivations yet; this phase is not scored.')}</div><h2 class="sectiontitle" style="margin-top:37px">Your answers</h2><p class="muted small">These remain on your own device unless you export or share them.</p>${[1,2,3].map(p=>`<details ${p===3?'':' '}><summary>Phase ${p} · ${phaseName(p)}</summary><div class="review-content">${QUESTIONS.filter(q=>q.phase===p).map(q=>{let ans=p===3?(state.written[q.id]||'(Not answered)'):(state.answers[q.id]||[]).map(i=>q.options[i].text).join(' / ');return `<div class="review-item"><div class="item-n">${String(q.number).padStart(2,'0')} · ${escapeHtml(q.title)}</div><p>${escapeHtml(ans||'(Not answered)')}</p>${p===3&&(state.tags[q.id]||[]).length?`<span class="tiny muted">Self-tagged: ${state.tags[q.id].map(h=>HOUSES[h].name).join(', ')}</span>`:''}</div>`;}).join('')}</div></details>`).join('')}</section><section class="datafoot"><div class="notes"><strong>Private and offline.</strong> Original, unofficial fan-made material. No login, network requests, or server-side scoring.</div><div class="actions"><button class="mini" id="exportResultJson">Save answer data</button><button class="mini" id="restartResults">Start new quiz</button></div></section></section>`;
}
function render(){const app=$('#app');app.innerHTML=state.view==='intro'?intro():state.view==='quiz'?questionPage():results();attach();}
function validateNext(){let q=QUESTIONS[state.index];if(q.phase<3 && !(state.answers[q.id]||[]).length){$('#error').textContent='Select at least one response to continue.';return false;}return true;}
function next(){if(!validateNext())return;if(state.index===54){if(!isComplete()){state.index=firstMissing();save();render();$('#error').textContent='Complete this unanswered choice before viewing your results.';return;}go('results');}else go('quiz',state.index+1);}
function selectOption(index){const q=QUESTIONS[state.index],cur=(state.answers[q.id]||[]).slice(),pos=cur.indexOf(index);if(pos>=0)cur.splice(pos,1);else if(cur.length<2)cur.push(index);else{$('#error').textContent='You can choose two responses at most. Deselect one to change your answer.';return;}state.answers[q.id]=cur.sort((a,b)=>a-b);save();$('#error').textContent='';document.querySelectorAll('.choice').forEach(node=>{const sel=cur.includes(Number(node.dataset.opt));node.classList.toggle('active',sel);node.setAttribute('aria-pressed',String(sel));const key=node.querySelector('.key');if(key)key.textContent='ABCD'[Number(node.dataset.opt)];});$('#selectionCount').textContent=`${cur.length}/2 selected`;}
function selectTag(h){const q=QUESTIONS[state.index],cur=(state.tags[q.id]||[]).slice(),pos=cur.indexOf(h);if(pos>=0)cur.splice(pos,1);else if(cur.length<2)cur.push(h);else{$('#error').textContent='Choose up to two motivations.';return;}state.tags[q.id]=cur;save();$('#error').textContent='';document.querySelectorAll('.motive').forEach(node=>{const active=cur.includes(node.dataset.tag);node.classList.toggle('active',active);node.setAttribute('aria-pressed',String(active));node.querySelector('.mcheck').textContent=active?'✓':'';});}
function clearAll(){if(!confirm('Erase your saved answers and restart? This cannot be undone unless you exported your data.'))return;state={view:'intro',index:0,answers:{},written:{},tags:{}};save();render();window.scrollTo({top:0,behavior:'instant'});}
function download(name,text,kind='text/plain'){const blob=new Blob([text],{type:kind+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportData(){download('sorting-study-saved-answers.json',JSON.stringify({format:'sorting-study-public-v1',savedAt:new Date().toISOString(),answers:state.answers,written:state.written,tags:state.tags,index:state.index},null,2),'application/json');}
async function importData(file){if(!file)return;try{const incoming=JSON.parse(await file.text());if(incoming.format!=='sorting-study-public-v1'||typeof incoming.answers!=='object'||typeof incoming.written!=='object'||typeof incoming.tags!=='object'||!incoming.answers||!incoming.written||!incoming.tags)throw Error('Not a saved Sorting Study quiz file.');if(!confirm('Load these saved answers? This will replace answers currently in your browser.'))return;const valid=new Set(QUESTIONS.map(q=>q.id));let answers={},written={},tags={};for(const [id,inds] of Object.entries(incoming.answers)){const q=QUESTIONS.find(q=>q.id===id);if(q&&q.phase<3&&Array.isArray(inds))answers[id]=[...new Set(inds.filter(x=>Number.isInteger(x)&&x>=0&&x<4))].slice(0,2);}for(const [id,txt] of Object.entries(incoming.written)){if(valid.has(id)&&id.startsWith('p3-')&&typeof txt==='string')written[id]=txt.slice(0,100000);}for(const [id,arr] of Object.entries(incoming.tags)){if(valid.has(id)&&id.startsWith('p3-')&&Array.isArray(arr))tags[id]=[...new Set(arr.filter(x=>Object.hasOwn(HOUSES,x)))].slice(0,2);}state={view:'intro',index:Number.isInteger(incoming.index)?Math.max(0,Math.min(54,incoming.index)):0,answers,written,tags};save();render();alert('Your answers have been loaded.');}catch(e){alert('Unable to import: '+e.message);}finally{$('#importFile').value='';}}
function attach(){const bind=(id,fn)=>{const n=$('#'+id);if(n)n.addEventListener('click',fn);};bind('beginBtn',()=>{const filled=countClosed()+countWritten();go('quiz',filled?state.index:0);});bind('restartBtn',clearAll);bind('restartBottom',clearAll);bind('restartResults',clearAll);bind('importBtn',()=>$('#importFile').click());bind('importBtn2',()=>$('#importFile').click());bind('resultShortcut',()=>go('results'));bind('goMissing',()=>go('quiz',Math.max(0,firstMissing())));bind('exportBottom',exportData);bind('exportResultJson',exportData);bind('backBtn',()=>go('quiz',state.index-1));bind('nextBtn',next);bind('skipToResult',()=>{if(isComplete())go('results');else go('quiz',Math.max(0,firstMissing()));});bind('editAnswers',()=>go('quiz',54));bind('downloadReport',()=>download('sorting-study-my-results.txt',resultText()));bind('printResults',()=>window.print());document.querySelectorAll('.choice').forEach(node=>node.addEventListener('click',()=>selectOption(Number(node.dataset.opt))));document.querySelectorAll('.motive').forEach(node=>node.addEventListener('click',()=>selectTag(node.dataset.tag)));const box=$('#writtenAnswer');if(box)box.addEventListener('input',()=>{const q=QUESTIONS[state.index];state.written[q.id]=box.value;save();$('#wordCount').textContent=(box.value.trim()?box.value.trim().split(/\s+/).length:0)+' words';$('#reflectBox').hidden=box.value.trim().length<15;});}
$('#homeBtn').addEventListener('click',()=>go('intro'));
$('#exportBtn').addEventListener('click',exportData);
$('#importFile').addEventListener('change',e=>importData(e.target.files[0]));
render();
})();
</script>
</body>
</html>
